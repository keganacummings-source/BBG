name = "dreamshare-api"
main = "worker.js"
compatibility_date = "2024-09-23"
workers_dev = true

[vars]
ENVIRONMENT = "production"
WORKER_ENDPOINT = "https://dreamshare-api.keganacummings.workers.dev"
KYOTO_API = "0.3.0"
VST_PATCH = "0.5.0"

# Optional persistence for community presets (without it, POST is accepted but not stored):
#   npx wrangler kv namespace create PRESETS     # then paste the id below
# [[kv_namespaces]]
# binding = "PRESETS"
# id = "<your-kv-namespace-id>"
